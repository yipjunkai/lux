version: 2

updates:
  # GitHub Actions — weekly grouped bumps. This is load-bearing: verify.yml
  # SHA-pins every action, and those pins do not self-update. Without Dependabot
  # bumping the SHA + version comment, every pinned action silently goes stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gha-minor:
        update-types: [minor, patch]
      gha-major:
        update-types: [major]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope

  # A `swift` (Swift Package Manager) ecosystem entry gets added here the day Lux
  # takes its first third-party package dependency. Today Lux uses only Apple
  # system frameworks (zero external deps), so there is nothing to update yet.
