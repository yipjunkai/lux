name: Stale

# Nudge and close inactive issues/PRs. Works on private repos too.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Close stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 30
          days-before-pr-stale: 30
          days-before-pr-close: 14
          exempt-issue-labels: "bug,security,help wanted,pinned,roadmap"
          exempt-pr-labels: "pinned"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been inactive for 60 days and will be closed in 30 days
            if there is no further activity.
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 14 days if
            there is no further activity.
