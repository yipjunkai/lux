name: Release

# Fires when release-please tags vX.Y.Z. Builds a universal Lux.app, Developer-ID
# signs + notarizes + staples it, packages a .dmg (with checksums), attaches it to
# the GitHub Release, then bumps the Homebrew Cask in yipjunkai/homebrew-lux.
#
# Signing is OPTIONAL: with the MACOS_* secrets present the build is Developer ID
# signed + notarized; without them it falls back to an UNSIGNED (ad-hoc) build
# (Gatekeeper warns — users install with `--no-quarantine`). See README.
#   MACOS_CERTIFICATE_P12_BASE64  base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD    the .p12 password
#   MACOS_SIGNING_IDENTITY        e.g. "Developer ID Application: Name (TEAMID)"
#   MACOS_NOTARY_KEY_BASE64       base64 of the App Store Connect API key (.p8)
#   MACOS_NOTARY_KEY_ID           the API key ID
#   MACOS_NOTARY_ISSUER_ID        the App Store Connect issuer UUID
#   RELEASE_PLEASE_APP_ID / _KEY  the same GitHub App used by release-please
#                                 (its token is scoped to homebrew-lux for the bump)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build · sign · notarize
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      dmg: ${{ steps.meta.outputs.dmg }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - name: Detect signing mode
        id: mode
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          NOTARY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$NOTARY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets present — Developer ID signed + notarized build."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No MACOS_* secrets — building UNSIGNED (ad-hoc). Users bypass Gatekeeper via 'brew install --cask --no-quarantine yipjunkai/lux/lux' or right-click Lux.app -> Open. Add the signing secrets for notarized builds."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Resolve version
        id: meta
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "dmg=Lux-${tag#v}.dmg"
          } >> "$GITHUB_OUTPUT"

      - name: Build universal Lux.app
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --arch x86_64
          bin="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/Lux"
          app="build/Lux.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin" "$app/Contents/MacOS/Lux"
          cp Info.plist "$app/Contents/Info.plist"
          lipo -info "$app/Contents/MacOS/Lux"

      - name: Import signing certificate
        if: ${{ steps.mode.outputs.signed == 'true' }}
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/build.keychain-db"
          kp="$(uuidgen)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc"
          security list-keychains -d user -s "$kc"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Codesign (hardened runtime)
        if: ${{ steps.mode.outputs.signed == 'true' }}
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "$IDENTITY" build/Lux.app
          codesign --verify --strict --verbose=2 build/Lux.app

      - name: Notarize + staple
        if: ${{ steps.mode.outputs.signed == 'true' }}
        env:
          NOTARY_B64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$NOTARY_B64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent build/Lux.app "$RUNNER_TEMP/Lux.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Lux.zip" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" \
            --wait
          xcrun stapler staple build/Lux.app
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Ad-hoc sign (unsigned build)
        if: ${{ steps.mode.outputs.signed == 'false' }}
        run: |
          set -euo pipefail
          # No Developer ID — ad-hoc sign so the app runs on Apple Silicon. Not
          # notarized: Gatekeeper warns on first launch until MACOS_* secrets exist.
          codesign --force --sign - build/Lux.app
          codesign --verify --verbose=2 build/Lux.app

      - name: Package DMG + checksums
        id: pkg
        env:
          DMG: ${{ steps.meta.outputs.dmg }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R build/Lux.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Lux" -srcfolder "$staging" -ov -format UDZO "build/$DMG"
          sha="$(shasum -a 256 "build/$DMG" | awk '{print $1}')"
          echo "$sha  $DMG" > "build/checksums.txt"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Attach assets to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            build/${{ steps.meta.outputs.dmg }}
            build/checksums.txt

  update-cask:
    name: Bump Homebrew Cask
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-lux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-lux
          token: ${{ steps.tap-token.outputs.token }}
          persist-credentials: true
      - name: Update cask
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          cask="Casks/lux.rb"
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" "$cask"
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"${SHA256}\"/" "$cask"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$cask"
          git diff --cached --quiet || git commit -m "lux ${VERSION}"
          git push
